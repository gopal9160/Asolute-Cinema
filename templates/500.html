{% extends "base.html" %}

{% block title %}Server Error — Absolute Cinema{% endblock %}

{% block content %}
    <section class="error-page">
        <p class="error-code rise" aria-hidden="true">500</p>
        <h2 class="rise" style="--d: 120ms">Something Went Wrong</h2>
        <p class="rise" style="--d: 220ms">Our server hit an unexpected error. Please try again in a moment.</p>
        <p class="rise" style="--d: 300ms"><a href="{{ url_for('home') }}" class="btn btn-secondary">Go back home</a></p>
    </section>
{% endblock %}
