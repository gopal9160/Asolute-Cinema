{% extends "base.html" %}

{% block title %}Add a Movie — Absolute Cinema{% endblock %}

{% block content %}
    <div class="narrow">
        <h2 class="rise">Add a Movie</h2>

        <form method="POST" action="{{ url_for('add_movie') }}" class="form-card rise" style="--d: 120ms">
            <div class="form-group">
                <label for="title" class="form-label">Title</label>
                <input type="text" id="title" name="title" class="form-input" required>
            </div>

            <div class="form-group">
                <label for="year" class="form-label">Year</label>
                <input type="number" id="year" name="year" class="form-input" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Add Movie</button>
                <a href="{{ url_for('movies') }}" class="btn btn-secondary">Back to movies</a>
            </div>
        </form>
    </div>
{% endblock %}
