{% extends "base.html" %}

{% block title %}Edit {{ movie.title }} - Absolute Cinema{% endblock %}

{% block content %}
    <h2>Edit: {{ movie.title }}</h2>

    <form method="POST" action="{{ url_for('edit_movie', movie_id=movie.id) }}">
        <p>
            <label for="title">Title:</label><br>
            <input type="text" id="title" name="title" value="{{ movie.title }}">
        </p>
        <p>
            <label for="year">Year:</label><br>
            <input type="number" id="year" name="year" value="{{ movie.year or '' }}">
        </p>
        <p>
            <input type="checkbox" id="watched" name="watched" {% if movie.watched %}checked{% endif %}>
            <label for="watched">Watched</label>
        </p>
        <button type="submit">Save Changes</button>
    </form>
    <p><a href="{{ url_for('movies') }}">Cancel</a></p>
{% endblock %}
