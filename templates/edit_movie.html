{% extends "base.html" %}

{% block title %}Edit {{ movie.title }} — Absolute Cinema{% endblock %}

{% block content %}
    <div class="narrow">
        <h2 class="rise">Edit: {{ movie.title }}</h2>

        <form method="POST" action="{{ url_for('edit_movie', movie_id=movie.id) }}" class="form-card rise" style="--d: 120ms">
            <div class="form-group">
                <label for="title" class="form-label">Title</label>
                <input type="text" id="title" name="title" class="form-input" value="{{ movie.title }}" required>
            </div>

            <div class="form-group">
                <label for="year" class="form-label">Year (optional)</label>
                <input type="number" id="year" name="year" class="form-input" value="{{ movie.year or '' }}">
            </div>

            <div class="form-group">
                <label class="switch">
                    <input type="checkbox" name="watched" {% if movie.watched %}checked{% endif %}>
                    <span class="switch-label">Mark as watched</span>
                </label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('movies') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
