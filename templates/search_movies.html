{% extends "base.html" %}

{% block title %}Find a Movie — Absolute Cinema{% endblock %}

{% block content %}
<div class="page-header rise">
    <h2>Find a Movie</h2>
    <a href="{{ url_for('movies') }}" class="btn btn-secondary">← Back to My Movies</a>
</div>

<p class="muted" style="margin-bottom: 20px;">
    Start typing a movie name. Results appear as you type.
</p>

<div class="search-form rise" style="--d: 100ms">
    <div class="search-field">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-3.5-3.5"/>
        </svg>
        <input type="text" id="search-input" class="form-input"
               placeholder="Type a movie name... e.g. Inception"
               autofocus autocomplete="off">
    </div>
</div>

<div id="search-status" class="muted" style="margin-top: 12px;"></div>

<div id="search-results" class="search-results"></div>

<p class="muted" style="margin-top: 32px;">
    Can't find it? <a href="{{ url_for('add_movie') }}">Add it manually</a>.
</p>

<script>
    (function () {
        const input = document.getElementById('search-input');
        const resultsEl = document.getElementById('search-results');
        const statusEl = document.getElementById('search-status');
        let debounceTimer = null;
        let lastQuery = '';

        function renderResults(results) {
            if (results.length === 0) {
                resultsEl.innerHTML = '';
                return;
            }

            resultsEl.innerHTML = results.map(movie => `
    <div class="search-result">
        ${movie.poster_url
            ? `<img src="${movie.poster_url}" alt="${escapeHtml(movie.title)}" class="search-poster">`
            : `<div class="search-poster search-poster-empty">No Poster</div>`}
        <div class="search-info">
            <h3>${escapeHtml(movie.title)} <span class="result-year">(${movie.year || '—'})</span></h3>
            <p class="result-meta">
                ${movie.rating > 0 ? `★ ${movie.rating}/10` : ''}
                ${movie.votes > 0 ? `<span class="sep">·</span> ${movie.votes.toLocaleString()} votes` : ''}
                ${movie.language ? `<span class="sep">·</span> ${movie.language}` : ''}
            </p>
            ${movie.overview ? `<p class="muted result-overview">${escapeHtml(movie.overview)}</p>` : ''}
            <form method="POST" action="/search/add">
                <input type="hidden" name="title" value="${escapeHtml(movie.title)}">
                <input type="hidden" name="year" value="${movie.year || ''}">
                <input type="hidden" name="poster_url" value="${movie.poster_url || ''}">
                <input type="hidden" name="tmdb_id" value="${movie.tmdb_id}">
                <button type="submit" class="btn btn-primary btn-sm">+ Add to Watchlist</button>
            </form>
        </div>
    </div>
`).join('');
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function search(query) {
            statusEl.textContent = 'Searching...';
            try {
                const res = await fetch('/api/search?q=' + encodeURIComponent(query));
                const data = await res.json();
                renderResults(data.results || []);

                if ((data.results || []).length === 0) {
                    statusEl.textContent = `No results for "${query}".`;
                } else {
                    statusEl.textContent = '';
                }
            } catch (err) {
                statusEl.textContent = 'Search failed. Try again.';
                console.error(err);
            }
        }

        input.addEventListener('input', () => {
            const query = input.value.trim();

            clearTimeout(debounceTimer);

            if (query.length < 2) {
                resultsEl.innerHTML = '';
                statusEl.textContent = query.length === 1 ? 'Keep typing...' : '';
                lastQuery = '';
                return;
            }

            if (query === lastQuery) return;

            debounceTimer = setTimeout(() => {
                lastQuery = query;
                search(query);
            }, 300);
        });
    })();
</script>
{% endblock %}
